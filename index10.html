<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p:nth-child(3){
            color:red;
        }
        p:nth-of-type(2){
            text-decoration:underline;
        }
    </style>
</head>
<body>
    <div>
        <p>this is a paragraph</p>
        <h1>this is a heading element</h1>
        <p>this is second paragraph</p>
    </div>
</body>
</html>
