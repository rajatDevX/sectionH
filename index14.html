<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid Property</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            height:100vh;
            width:100vw;
        }
        div{
            border:2px solid black;
        }
        .container{
            background-color: aliceblue;
            display:grid;
            height:100%;
            gap:2px;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows:repeat(4,1fr);
            /* justify-content: center; */
            /* align-items: center; */
            /* min-width: 0; */
            
        }
        .item{
            background-color: crimson;
            font-size:1.5rem;
        }
        .center{
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .header{
            grid-column-start:1;
            grid-column-end:4;
        }
        .footer{
            grid-column-start:1;
            grid-column-end:4;
        }
        .sidebar{
            grid-row-start:2;
            grid-row-end:4;
        }
        .content{
            grid-column-start:2;
            grid-column-end:4;
        }



    </style>
</head>
<body>
    <div class="container">
        <div class="item center header">Header</div>
        <div class="item center sidebar">sidebar</div>
        <div class="item center">content1</div>
        <div class="item center">content2</div>
        <div class="item center content">content3</div>
        <div class="item center footer">footer</div>
    </div>

    
</body>
</html>
