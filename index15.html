<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        body{
            height:100vh;
            width:100vw;
        }
        div{
            border:2px solid black;
        }
        .container{
            background-color: aliceblue;
            width:100%;
            height:100%;
            display:grid;
            gap:5px;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,1fr);
        }
        .center{
            display:flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }
        .red{
            background-color: red;
        }
        .green{
            background-color: green;
        }
        .orange{
            background-color: orange;
        }
        .first{
            grid-row:1/4;
        }
        .second{
            grid-column: 2/4;
        }
        .sidebar{
            grid-row:2/4;
            grid-column:4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box center first green">1</div>
        <div class="box center second green">2</div>
        <div class="box center red">3</div>
        <div class="box center orange">4</div>
        <div class="box center red">5</div>
        <div class="box center sidebar green">6</div>
        <div class="box center red">7</div>
        <div class="box center orange">8</div>
    </div>
</body>
</html>
