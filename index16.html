<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body{
          height:100vh;
          width:100vw;
      }
      div{
          border:2px solid black;
      }
      .container{
          background-color: aliceblue;
          width:100%;
          height:100%;
          display:grid;
          grid-template-areas:
          "header header"
          "sidebar content"
          "footer footer";

      }
      .header{
          grid-area:header;
      }
      .footer{
          grid-area:footer;
      }
      .center{
          display:flex;
          justify-content: center;
          align-items: center;
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header center">Header</div>
      <div class="sidebar center">sidebar</div>
      <div class="content center">content</div>
      <div class="footer center">footer</div>
    </div>
  </body>
</html>
