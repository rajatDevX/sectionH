<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background: red;

        animation: moveBox 2s;
      }

      @keyframes moveBox {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(300px);
        }
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
  </body>
</html>
