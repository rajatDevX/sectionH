<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loader</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        height: 100px;
        width: 100px;
        background-color: rgb(233, 219, 219);
        border-bottom: 2px solid black;
        border-radius: 50%;
        animation:rotate 3s;
        animation-iteration-count: infinite;
      }
      @keyframes rotate {
        from {
          transform: roate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
