<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic light</title>
    <style>
        .container{
            height:400px;
            width:200px;
            background-color: rgb(79, 68, 68);
            margin:auto;
            border-radius:10px;
        }
        .circle{
            height:125px;
            width:80%;
            margin:5px auto;

            border-radius:50%;
            opacity:0.2;
        }
        .red{
            background-color: red;
            animation: red 6s infinite;
        }
        .yellow{
            background-color: yellow;
            animation:yellow 6s infinite;
        }
        .green{
            background-color: green;
            animation:green 6s infinite;
        }
        @keyframes red{
            0%,33%{
                opacity:1;
            }
            34%,100%{
                opacity:0.2
            }

        }
        @keyframes yellow{
            0%,33%{
                opacity:0.2
            }
            34%,66%{
               opacity:1
            }
            67%,100%{
                opacity:0.2;
            }


        }
        @keyframes green{
             0%,66%{
                opacity:0.2;
            }
            67%,100%{
                opacity:1;
            }


        }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="circle red"></div>
      <div class="circle yellow"></div>
      <div class="circle green"></div>
    </div>
  </body>
</html>
