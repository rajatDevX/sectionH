<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CSS</title>
    <style>
        .scene{
            perspective: 600px;
        }
        .box{
            height:300px;
            width:300px;
            background-color: blueviolet;
            border:1px solid black;
            /* transform:rotateY(-45deg); */
            margin:50px auto; 
            transition: all 2s;
           
        }
        .box:hover{
            transform:rotateY(-45deg);
             box-shadow:1px 1px 10px 4px rgb(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="box"></div>
    </div>
    
</body>
</html>
