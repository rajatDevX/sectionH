<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D card</title>
    <style>
        .center{
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .scene{
            width:300px;
            height:200px;
            perspective:600px;
            margin:20px auto;
        }
        .card{
            width:100%;
            height:100%;
            position:relative;
            transform-style:preserve-3d;
            transition:all 4s;
        }
        .front,.back{
            width:100%;
            height:100%;
            position:absolute;
            backface-visibility:hidden;
        }
        .front{
            background-color: chocolate;

        }
        .back{
            background-color: rgb(89, 164, 229);
            transform: rotateY(180deg);
        }
         .card:hover{
            transform: rotateY(-180deg);
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="card">
            <div class="front center">Front </div>
            <div class="back center">Back</div>
        </div>
    </div>
</body>
</html>
