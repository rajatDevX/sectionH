<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML form</title>
  </head>
  <body>
    <h1>HTML Form</h1>

    <form action="index4.html" method="get">
      <fieldset>
        <legend>student registration form</legend>
        <label for="name">Name-</label>
        <input type="text" id="name" name="name" />

        <br />
        <br />

        <label for="Password">Password-</label>
        <input type="password" id="password" name="password" />
        <br />
        <br />

        <label for="email">Email-</label>
        <input type="email" name="email" id="email" />
        <br />
        <br />

        <label for="gender">select your gender</label>
        <input type="radio" value="male" name="gender" id="gender" />male
        <input type="radio" value="female" name="gender" id="gender" />female

        <br />
        <br />

        <label for="option">choose the correct answer</label>
        <input type="radio" name="option" id="option" value="html" />html
        <input type="radio" name="option" id="option" value="css" />css
        <input
          type="radio"
          name="option"
          id="option"
          value="javascript"
        />javascript
        <br />
        <br />

        <label for="city">select your city</label>
        <select name="city" id="city">
          <option value="" selected disabled>choose your city</option>
          <option value="agra">Agra</option>
          <option value="lucknow">Lucknow</option>
          <option value="kanpur">Kanpur</option>
        </select>

        <br />
        <br />

        <input type="submit" value="submit" />
      </fieldset>
    </form>
    <iframe src="index1.html" frameborder="1"></iframe>
    <iframe width="500" height="500" src="https://www.youtube.com/embed/XCPZBD9lbVo?list=PLbMVogVj5nJQu5qwm-HmJgjmeGhsErvXD" title="Artificial Intelligence: Introduction" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


    <video controls>
        <source src="video.mp4" type="video/mp4" />
    </video>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg" />
    </audio>
  </body>
</html>
