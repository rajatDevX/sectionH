<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
        .center{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
      .card {
        width: 300px;
        overflow: hidden;
        border-radius: 20px;
        background: white;
        position: relative;
        border:1px solid #ccc;
      }
      .cover {
        width: 100%;
        height: 150px;
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profile {
        width: 110px;
        height: 110px;
        margin: -55px auto 0;
        border: 5px solid white;
        border-radius: 50%;
        overflow: hidden;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .profile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 20%;
      }
      .content {
        margin-top:30px;
        text-align: center;
        padding: 15px 20px 25px;
      }
    </style>
  </head>
  <body class="center">
    <div class="card">
      <div class="cover">
        <img src="image3.png" alt="hero" />
      </div>
      <div class="profile">
        <img src="macbook.png" alt="profile" />
      </div>
      <div class="content">
        <h2>Apple Product</h2>
        <p>Macbook</p>
      </div>
    </div>
  </body>
</html>
