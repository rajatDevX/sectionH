<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
   <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <h1 class="text-2xl text-center bg-red-600 text-white font-bold p-4 m-2 rounded-lg">Tailwind CSS</h1>
    <p class="bg-blue-600 text-white font-bold text-center p-4 m-4 rounded-xl">I am learning tailwind css</p>
    <p class="text-4xl w-1/2 mx-auto bg-yellow-200 text-center p-5 rounded-2xl">This is a paragraph with some width</p>
    <p class="w-32 bg-green-600 mx-auto my-3 p-3 border border-blue-500 border-8">this is a paragraph with w-32 means 4*32=128px or 32/4=8rem</p>
    <!-- <div class="relative bg-yellow-800 p-4 top-8 w-32 h-32  inline-block">this is relative position
        <div class="absolute top-0">this is absolute class</div>
    </div> -->

    <div class="flex gap-4 justify-between bg-green-100 p-2 items-center min-h-screen flex-col md:flex-row">
        <div class="border border-4 flex-1 border-black text-center h-32 w-full">one</div>
        <div class="border border-4 flex-1 border-black text-center h-32 w-full">two</div>
        <div class="border border-4 flex-1 border-black text-center h-32 w-full">three</div>
        <div class="border border-4 flex-1 border-black text-center h-32 w-full">four</div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
        <div>one</div>
        <div>two</div>
        <div>three</div>
        <div>four</div>
        <div>five</div>
        <div>six</div>
    </div>
    <button class="bg-blue-500 mx-auto block px-5 py-4 text-3xl text-white hover:bg-blue-700 transition duration-1000">click me</button>
</body>
</html>
