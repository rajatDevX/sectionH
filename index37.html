<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggle</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark,.dark *));
     </style>
</head>
<body class="min-h-screen bg-white text-black p-10 dark:bg-gray-900 dark:text-white">
    <h1 class="text-3xl font-bold">Hello Students</h1>
    <p class="mt-4">Press the button for changing the theme</p>
    <button id="themeButton"type="button"class="bg-blue-700 text-white rounded px-2 py-1 mt-4">Switch to Dark Mode</button>
    <script>
        const button=document.getElementById("themeButton");
        button.addEventListener("click",function(){
            const isDark=document.documentElement.classList.toggle("dark");
            button.textContent=isDark?"Switch to light Mode":"Switch to Dark Mode";
        });
    </script>
    
</body>
</html>
