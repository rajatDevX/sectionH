<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            width:100vw;
            height:100vh;
        }
      .first {
        border-left: 5px solid red;
        border-right: 3px solid green;
        border-top: 2px solid blue;
        border-bottom: 1px solid black;
        display: block;
        height: 200px;
       
        width:200px;
      }
      .second {
        display: inline;
        height: 200px;
        width: 200px;
        border-left: 5px solid red;
        border-right: 3px solid green;
        border-top: 2px solid blue;
        border-bottom: 1px solid black;
      }
      .third {
        display: inline-block;
        height: 200px;
        width: 200px;
        border-left: 5px solid red;
        border-right: 3px solid green;
        border-top: 2px solid blue;
        border-bottom: 1px solid black;
      }
    </style>
  </head>
  <body>
    <div class="first">this is content</div>
    <div class="second">
      this is content inside div element with class second
    </div>
    <div class="third">this is content inside div element with class third</div>
  </body>
</html>
