<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html{
          font-size:20px;
      }
      h1{
          font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
          font-size:2rem;
          font-weight:700;
          font-style:italic;
          text-align:center;
          text-decoration: underline;
          text-transform: uppercase;
          text-shadow:2px 2px 3px red;
          line-height:30px;

      }
      p{
          font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
          font-size:30px;
          font-weight:800;
          font-style:oblique;
          text-align:left;
          text-transform: lowercase;
          text-shadow:2px 2px 4px lightblue;
          line-height:40px;
          letter-spacing: 10px;
          word-spacing:20px;
      }
      div{
          font-size:20px;
          text-align:right;
          font-size:40px;
          font-weight:bold;
          text-shadow:3px 3px 4px pink;
      }
     
      div.first p{
          font-size:2em;
          text-transform:capitalize;
           text-shadow:2px 2px 4px green;
      }
    </style>
  </head>
  <body>
    <h1>I am going to learn font style today</h1>
    <p>this is a paragraph with diffrent font-family</p>
    <div class="first">
      this is content inside first div with font-size in em
      <p>this is a paragraph inside first div</p>
      <p>this is a paragraph inside first div</p>
    </div>
  </body>
</html>
