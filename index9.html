<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height:2000px;
        }
        .container{
            border:2px solid black;
            height:2000px;
        }
        img{
            height:300px;
            width:300px;
        }
        .first{
            position:static;
            top:20px;
            left:30px;
        }
        .second{
            position:relative;
            top:20px;
            left:30px;
        }
        .third{
            position:absolute;
            top:70px;
            left:70px;

        }
        .fourth{
            position:fixed;
            top:70px;
            left:70px;
        }
        .container2{
            height:2000px;
            border:2px solid black;
        }
        .fifth{
            position:sticky;
            top:70px;
            left:70px;
        }

    </style>
</head>
<body>
    <div class="container">
        <img src="image.png" alt="first image" class="first">
        <img src="image1.png" alt="second" class="second">
        <img src="image3.png" alt="third" class="third">
        <img src="image4.png" alt="fourth" class="fourth">
        <img src="image.png" alt="fifth" class="fifth">
    </div>
    <div class="container2">
        this is second container.
    </div>
</body>
</html>
